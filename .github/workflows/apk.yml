name: Build Salaama APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create android folder
        run: flutter create . --platforms=android

      - name: Fix compileSdk 34 -> 36 everywhere
        run: |
          # 1. Fix your app
          sed -i 's/compileSdk.*/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' android/app/build.gradle || true
          sed -i 's/35/36/g' android/app/build.gradle.kts || true
          sed -i 's/34/36/g' android/app/build.gradle.kts || true
          
          # 2. Fix file_picker and other plugins in pub cache
          flutter pub get
          find ~/.pub-cache -name "build.gradle" -o -name "build.gradle.kts" | xargs grep -l "compileSdk.*34" 2>/dev/null | xargs sed -i 's/34/36/g' 2>/dev/null || true
          find ~/.pub-cache -name "build.gradle*" | xargs sed -i 's/compileSdk.*34/compileSdk = 36/g; s/compileSdkVersion.*34/compileSdkVersion 36/g; s/34/36/g' 2>/dev/null || true
          
          echo "Fixed! Checking:"
          cat android/app/build.gradle.kts | grep compileSdk

      - name: Upgrade file_picker
        run: |
          flutter pub upgrade file_picker
          flutter pub upgrade flutter_plugin_android_lifecycle
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Salaama-School-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
