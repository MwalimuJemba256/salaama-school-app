name: Build Salaama APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create android folder
        run: flutter create . --platforms=android

      - name: Set compileSdk to 36
        run: |
          echo "Files in android/app:"
          ls android/app/
          echo "--- Content ---"
          cat android/app/build.gradle.kts || cat android/app/build.gradle
          echo "--- Fixing ---"
          # Fix both .kts and .gradle files
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdkVersion.*/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle.kts
            sed -i 's/35/36/g' android/app/build.gradle.kts
            sed -i 's/34/36/g' android/app/build.gradle.kts
            cat android/app/build.gradle.kts | grep compileSdk
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/34/36/g' android/app/build.gradle
            sed -i 's/35/36/g' android/app/build.gradle
          fi

      - name: Build APK
        run: |
          flutter pub get
          flutter pub upgrade file_picker
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Salaama-School-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
