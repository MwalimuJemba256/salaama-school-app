name: Build Salaama APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Fix iOS folder + Generate Icons
        run: |
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          echo '{"images":[],"info":{"author":"xcode","version":1}}' > ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json
          dart run flutter_launcher_icons
          ls android/app/src/main/res/mipmap-*/ic_launcher.png || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salaama-School-APK-Final
          path: build/app/outputs/flutter-apk/app-release.apk
