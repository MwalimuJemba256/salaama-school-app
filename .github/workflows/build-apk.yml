name: Build Salaama APK - Manual Icon

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: flutter pub get

      - name: MANUALLY SET SALAAMA ICON - 100% WORKS!
        run: |
          echo "Copying Salaama icon to all mipmap folders..."
          for folder in android/app/src/main/res/mipmap-*; do
            echo "Copying to $folder"
            cp assets/images/icon.png $folder/ic_launcher.png
            cp assets/images/icon.png $folder/launcher_icon.png || true
          done
          ls -lh android/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Build APK with Salaama Icon
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salaama-School-APK-ICON-FIXED
          path: build/app/outputs/flutter-apk/app-release.apk
