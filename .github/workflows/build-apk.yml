name: Build Salaama APK - Icon Fixed

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Create Mipmap Folders + Set Salaama Icon
        run: |
          echo "Creating mipmap folders..."
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          echo "Copying Salaama icon..."
          cp assets/images/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/images/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/images/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/images/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/images/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          cp assets/images/icon.png android/app/src/main/res/mipmap-hdpi/launcher_icon.png
          cp assets/images/icon.png android/app/src/main/res/mipmap-mdpi/launcher_icon.png
          cp assets/images/icon.png android/app/src/main/res/mipmap-xhdpi/launcher_icon.png
          cp assets/images/icon.png android/app/src/main/res/mipmap-xxhdpi/launcher_icon.png
          cp assets/images/icon.png android/app/src/main/res/mipmap-xxxhdpi/launcher_icon.png
          
          echo "Icon set! Checking..."
          ls -lh android/app/src/main/res/mipmap-hdpi/

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salaama-APK-Final-Icon
          path: build/app/outputs/flutter-apk/app-release.apk
