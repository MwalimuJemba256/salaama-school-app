name: Build Salaama APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          
      - name: Restore Android folder (fix missing mipmap)
        run: |
          # Backup google-services.json if exists
          cp android/app/google-services.json /tmp/ 2>/dev/null || echo "no google file"
          # Delete broken android and recreate
          rm -rf android
          flutter create . --platforms=android --project-name salaama_school
          # Restore google-services.json
          cp /tmp/google-services.json android/app/ 2>/dev/null || echo "no google file to restore"
          # Fix applicationId to your real one
          sed -i 's/com.example.salaama_school/com.salaama.schoolapp/g' android/app/build.gradle
          sed -i 's/com.example.salaama_school/com.salaama.schoolapp/g' android/app/src/main/AndroidManifest.xml
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build APK Release
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salaama-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
