name: Build Salaama APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Find Flutter Project
        id: find_project
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_OUTPUT
          elif [ -f "salaama_school_app/pubspec.yaml" ]; then
            echo "PROJECT_DIR=salaama_school_app" >> $GITHUB_OUTPUT
          else
            echo "PROJECT_DIR=." >> $GITHUB_OUTPUT
          fi
          echo "Project dir: $(cat $GITHUB_OUTPUT | grep PROJECT_DIR)"

      - name: Fix Salaama Icon
        run: |
          ICON=$(find . -type f -name "logo.png" | grep assets | head -n 1)
          if [ -z "$ICON" ]; then
            ICON=$(find . -type f -name "*.png" | head -n 1)
          fi
          echo "Using icon: $ICON"
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
          for size in 48 72 96 144 192; do
            case $size in
              48) dir="mipmap-mdpi";;
              72) dir="mipmap-hdpi";;
              96) dir="mipmap-xhdpi";;
              144) dir="mipmap-xxhdpi";;
              192) dir="mipmap-xxxhdpi";;
            esac
            mkdir -p android/app/src/main/res/$dir
            if [ -f "$ICON" ]; then
              convert "$ICON" -resize ${size}x${size} android/app/src/main/res/$dir/ic_launcher.png || echo "Icon resize failed for $size"
            fi
          done
        working-directory: ${{ steps.find_project.outputs.PROJECT_DIR }}

      - name: Flutter Pub Get
        run: flutter pub get
        working-directory: ${{ steps.find_project.outputs.PROJECT_DIR }}

      - name: Build APK
        run: flutter build apk --release
        working-directory: ${{ steps.find_project.outputs.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salaama-APK
          path: ${{ steps.find_project.outputs.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
