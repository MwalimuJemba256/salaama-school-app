name: Deploy Salaama Web
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Enable Web
        run: flutter config --enable-web
      - name: Get packages
        run: flutter pub get
      - name: Build Web
        run: flutter build web --release --base-href /salaama-school-app/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
