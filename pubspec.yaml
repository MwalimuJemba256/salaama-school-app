name: salaama_school
description: Salaama Muslim Junior School - DESTINED TO SUCCEED
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

# APP ICON - SALAAMA LOGO - CLEAN CIRCLE FOR PHONE ICON
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#0D6FB7"
    theme_color: "#0D6FB7"

# SPLASH - BLUE BACKGROUND + FULL LOGO WITH RIBBON
flutter_native_splash:
  color: "#0D6FB7"
  image: assets/images/logo.png
  branding: assets/images/logo.png
  android_12:
    color: "#0D6FB7"
    image: assets/images/logo.png
    branding: assets/images/logo.png
    icon_background_color: "#ffffff"
    image_inset: 16
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
