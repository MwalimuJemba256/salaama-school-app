name: salaama_school
description: Salaama Muslim Junior School - Destined to Succeed
publish_to: 'none'
version: 18.0.0+18

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  
  # Images & IDs
  image_picker: ^1.0.7
  uuid: ^4.4.0
  
  # Documents - PDF + PNG + Share
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  screenshot: ^2.1.0

  # ===== SCHOOL MEDIA - VIDEO PANEL + AUDIO FOR ALL PEOPLE =====
  video_player: ^2.8.2
  chewie: ^1.8.1
  audioplayers: 5.2.1
  file_picker: ^8.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path_android: "assets/images/icon.png"
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#0D5A2D"
  image: assets/images/logo.png
  android_12:
    color: "#0D5A2D"
    image: assets/images/logo.png
  android: true
  ios: false
  web: false
