name: salaama_school_app
description: Salaama Muslim Junior School - Destined to Succeed
publish_to: 'none'
version: 18.0.0+18

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.12.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  pdf: ^3.10.7
  printing: ^5.11.0
  share_plus: ^7.2.1
  screenshot: ^2.1.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"