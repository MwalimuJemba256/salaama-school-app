name: salaama_muslim_junior_school
description: Salaama Muslim Junior School App - Destined to Succeed - Admin, Teacher, Parent - Secular, Theology, Tahfiizu (No Classes)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Firebase for data (optional but recommended)
  firebase_core: ^2.24.0
  cloud_firestore: ^4.15.0
  firebase_auth: ^4.15.0
  # PDF & Documents Generator
  pdf: ^3.10.7
  printing: ^5.11.0
  path_provider: ^2.1.2
  # Media & Chat
  image_picker: ^1.0.4
  cached_network_image: ^3.2.3
  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/
  # App Icon will use same logo